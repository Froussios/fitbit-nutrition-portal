<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex" />
    <title>Sign-in test</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      body {
        max-width: 40rem;
        margin: 0 auto;
        padding: 16px;
      }
      button {
        font: inherit;
        min-height: 44px;
        padding: 0 16px;
        margin: 0 8px 8px 0;
      }
      pre {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid currentColor;
        border-radius: 6px;
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <h1>Sign-in test</h1>
    <p>
      Temporary page for <a href="https://github.com/Froussios/fitbit-nutrition-portal/issues/55">issue #55</a>. It checks that one Google sign-in returns an access token and an ID token. It reads from your
      diary without showing what it reads, changes nothing, and does not show or keep the tokens.
    </p>
    <button id="sign-in" type="button">Sign in</button>
    <button id="choose" type="button">Sign in, choosing the account</button>
    <button id="copy" type="button" hidden>Copy results</button>
    <p id="status" role="status"></p>
    <pre id="results" hidden></pre>
    <script src="auth-test.js"></script>
  </body>
</html>
