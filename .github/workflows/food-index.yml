name: Food index

# Builds the static food index from the Open Food Facts export and reports its
# counts and sizes. See docs/FOOD_SEARCH.md section 7.
#
# Publishing is not wired up yet: the index must NOT be committed to git, where
# every rebuild would stay in the history for good. Where it will live (release
# asset, Cloudflare Pages, R2) is being decided. Runs by hand only.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: food-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build the index from the Open Food Facts export
        env:
          EXPORT_URL: https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz
          USER_AGENT: FoodDiaryIndexBuilder/1.0 (+https://github.com/Froussios/fitbit-nutrition-portal)
        run: |
          set -euo pipefail
          LAST_MODIFIED=$(curl -sSfIL -A "$USER_AGENT" "$EXPORT_URL" | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -d '\r' || true)
          # Streamed and decompressed on the fly; pipefail stops a truncated download from producing a partial index.
          curl -sSfL --retry 3 -A "$USER_AGENT" "$EXPORT_URL" \
            | gzip -dc \
            | node --max-old-space-size=5632 --import tsx pipeline/build-index.ts \
                --out public/food-index --source-url "$EXPORT_URL" --last-modified "$LAST_MODIFIED" \
            | tee -a "$GITHUB_STEP_SUMMARY"
