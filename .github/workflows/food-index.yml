name: Food index

# Builds the static food index from the Open Food Facts export and deploys it to
# Cloudflare Pages. The index is never committed to git (every rebuild would stay
# in the history). See docs/FOOD_SEARCH.md section 7 and the README.
#
# Credentials: CLOUDFLARE_API_TOKEN (Account > Cloudflare Pages > Edit) and
# CLOUDFLARE_ACCOUNT_ID, as secrets of the "food-index" environment (or of the
# repository). Restrict that environment to the main branch so only reviewed code
# can use the token.
#
# The same site serves the meal prep API at /api/* (DR-24): functions/, with a D1
# database. Deploying it needs CLOUDFLARE_D1_TOKEN (Account > D1 > Edit and Account >
# Cloudflare Pages > Edit) in the same environment. Without it, or if it lacks either
# permission, the deploy leaves the API out with a warning and the index is published as
# before. If preparing or deploying the API fails anyway, the index is deployed without it
# and the run is marked failed.
#
# Crosstalk guard: a Pages token can edit every Pages project in its account, so
# this workflow only ever touches PAGES_PROJECT, and refuses to deploy to an
# existing project unless its live site serves food-index-owner.json naming this
# repository (or it has never been deployed).

on:
  workflow_dispatch:
  schedule:
    # Weekly, Sunday 16:17 UTC (early Monday morning in Sydney).
    - cron: "17 16 * * 0"

permissions:
  contents: read

concurrency:
  group: food-index
  cancel-in-progress: false

env:
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'food-diary-index' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: food-index
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check the credentials and that the Pages project is ours
        id: project
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (README, Food index)."
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT"
          status=$(curl -sS -o project.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$api")
          case "$status" in
            404)
              echo "Project $PAGES_PROJECT does not exist yet; it will be created."
              echo "create=true" >> "$GITHUB_OUTPUT"
              ;;
            200)
              subdomain=$(jq -r '.result.subdomain' project.json)
              deployed=$(jq -r '.result.latest_deployment.id // empty' project.json)
              if [ -n "$deployed" ]; then
                owner=$(curl -sS --fail "https://$subdomain/food-index-owner.json" | jq -r '.repository' || true)
                if [ "$owner" != "$GITHUB_REPOSITORY" ]; then
                  echo "::error::Pages project $PAGES_PROJECT ($subdomain) is not this repository's food index (owner: '${owner:-none}'). Refusing to overwrite it. Set the CLOUDFLARE_PAGES_PROJECT variable to another name."
                  exit 1
                fi
              fi
              echo "Deploying to our existing project $PAGES_PROJECT ($subdomain)."
              echo "create=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Cloudflare API returned HTTP $status for project $PAGES_PROJECT:"
              jq -c '.errors' project.json || cat project.json
              exit 1
              ;;
          esac

      # Checked before the long build, so that a token without enough access shows up at once, not after 30 minutes.
      - name: Check the meal prep API's token
        id: d1
        env:
          D1_TOKEN: ${{ secrets.CLOUDFLARE_D1_TOKEN }}
          CREATE: ${{ steps.project.outputs.create }}
        run: |
          set -euo pipefail
          if [ -z "$D1_TOKEN" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID"
          # An outage gives 000, so the API is left out with a warning instead of failing the run.
          d1=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $D1_TOKEN" "$base/d1/database" || true)
          pages=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $D1_TOKEN" "$base/pages/projects/$PAGES_PROJECT" || true)
          if [ "$d1" = 200 ] && { [ "$pages" = 200 ] || { [ "$pages" = 404 ] && [ "$CREATE" = true ]; }; }; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLOUDFLARE_D1_TOKEN can't reach both D1 (HTTP $d1) and the Pages project (HTTP $pages). It needs Account > D1 > Edit and Account > Cloudflare Pages > Edit. This deploy leaves out the meal prep API." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build the index from the Open Food Facts export
        env:
          EXPORT_URL: https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz
          USER_AGENT: FoodDiaryIndexBuilder/1.0 (+https://github.com/Froussios/fitbit-nutrition-portal)
        run: |
          set -euo pipefail
          LAST_MODIFIED=$(curl -sSfIL -A "$USER_AGENT" "$EXPORT_URL" | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -d '\r' || true)
          # Streamed and decompressed on the fly; pipefail stops a truncated download from producing a partial index.
          curl -sSfL --retry 3 -A "$USER_AGENT" "$EXPORT_URL" \
            | gzip -dc \
            | node --max-old-space-size=5632 --import tsx pipeline/build-index.ts \
                --out food-index-dist --owner "$GITHUB_REPOSITORY" \
                --version "$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" \
                --source-url "$EXPORT_URL" --last-modified "$LAST_MODIFIED" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prepare the meal prep API
        id: api
        env:
          D1_TOKEN: ${{ steps.d1.outputs.ok == 'true' && secrets.CLOUDFLARE_D1_TOKEN || '' }}
          HAS_SECRET: ${{ secrets.CLOUDFLARE_D1_TOKEN != '' }}
        run: |
          set -euo pipefail
          leave_out() {
            rm -rf functions wrangler.jsonc food-index-dist/_routes.json
            echo "included=false" >> "$GITHUB_OUTPUT"
          }
          if [ -z "$D1_TOKEN" ]; then
            # A secret that failed the check has already said why.
            if [ "$HAS_SECRET" != true ]; then echo "::warning::No CLOUDFLARE_D1_TOKEN secret, so this deploy leaves out the meal prep API (README, Food index)."; fi
            leave_out
            exit 0
          fi
          # In a subshell, so that a failure leaves the API out and the index still deploys (the run is failed at the end).
          set +e
          (
            set -euo pipefail
            export CLOUDFLARE_API_TOKEN="$D1_TOKEN"
            find_db() { npx --yes wrangler@4 d1 list --json | jq -r '.[] | select(.name == "food-diary") | (.uuid // .id)'; }
            id=$(find_db)
            if [ -z "$id" ]; then
              echo "Creating the D1 database food-diary."
              npx --yes wrangler@4 d1 create food-diary
              id=$(find_db)
            fi
            if ! [[ "$id" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "Could not find the D1 database food-diary."
              exit 1
            fi
            sed -i "s/00000000-0000-0000-0000-000000000000/$id/; s/\"name\": \"food-diary-index\"/\"name\": \"$PAGES_PROJECT\"/" wrangler.jsonc
            grep -q "\"database_id\": \"$id\"" wrangler.jsonc
            grep -q "\"name\": \"$PAGES_PROJECT\"" wrangler.jsonc
            npx --yes wrangler@4 d1 migrations apply DB --remote
            echo "Meal prep API included, with D1 database \`$id\`." | tee -a "$GITHUB_STEP_SUMMARY"
          )
          prepared=$?
          set -e
          if [ "$prepared" = 0 ]; then
            echo "included=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Preparing the meal prep API failed (see the log above; often CLOUDFLARE_D1_TOKEN lacks Account > D1 > Edit). The index is deployed without the API, and the run is marked failed." | tee -a "$GITHUB_STEP_SUMMARY"
            leave_out
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Cloudflare Pages
        env:
          # Attaching the database needs a token with D1 access as well as Pages.
          D1_TOKEN: ${{ steps.api.outputs.included == 'true' && secrets.CLOUDFLARE_D1_TOKEN || '' }}
          PREPARE_FAILED: ${{ steps.api.outputs.failed }}
        run: |
          set -euo pipefail
          if [ "${{ steps.project.outputs.create }}" = "true" ]; then
            npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch=main
          fi
          deploy() { npx --yes wrangler@4 pages deploy food-index-dist --project-name="$PAGES_PROJECT" --branch=main --commit-dirty=true; }
          if [ -z "$D1_TOKEN" ]; then
            deploy
          elif CLOUDFLARE_API_TOKEN="$D1_TOKEN" deploy; then
            echo "Deployed with the meal prep API." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            # The index must still go out: deploy it as before, without the API.
            echo "::error::Deploying with the meal prep API failed (see the log above; often CLOUDFLARE_D1_TOKEN lacks Account > Cloudflare Pages > Edit). The index is deployed without the API, and the run is marked failed." | tee -a "$GITHUB_STEP_SUMMARY"
            rm -rf functions wrangler.jsonc food-index-dist/_routes.json
            deploy
            api_failed=true
          fi
          subdomain=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PAGES_PROJECT" | jq -r '.result.subdomain')
          echo "Deployed to Cloudflare Pages project **$PAGES_PROJECT** (https://$subdomain/). The app reads it through the custom domain in the FOOD_INDEX_URL repository variable." | tee -a "$GITHUB_STEP_SUMMARY"
          # The index is out, but a deploy that dropped the API must not look like a success.
          if [ "${api_failed:-false}" = true ] || [ "$PREPARE_FAILED" = true ]; then exit 1; fi
