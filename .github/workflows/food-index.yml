name: Food index

# Builds the static food index (public/food-index/) from the Open Food Facts
# export and commits it to the branch, where the CI workflow deploys it to
# GitHub Pages with the app. See docs/FOOD_SEARCH.md section 7.
#
# Runs by hand, and when the builder or the code that shapes the index changes.

on:
  workflow_dispatch:
  push:
    paths:
      - "pipeline/**"
      - "src/core/off.ts"
      - "src/core/tokens.ts"
      - "src/core/food-summary.ts"
      - "src/food/index-format.ts"
      - ".github/workflows/food-index.yml"

permissions:
  contents: write

concurrency:
  group: food-index-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Build the index from the Open Food Facts export
        env:
          EXPORT_URL: https://static.openfoodfacts.org/data/openfoodfacts-products.jsonl.gz
          USER_AGENT: FoodDiaryIndexBuilder/1.0 (+https://github.com/Froussios/fitbit-nutrition-portal)
        run: |
          set -euo pipefail
          LAST_MODIFIED=$(curl -sSfIL -A "$USER_AGENT" "$EXPORT_URL" | grep -i '^last-modified:' | tail -1 | cut -d' ' -f2- | tr -d '\r' || true)
          # Streamed and decompressed on the fly; pipefail stops a truncated download from producing a partial index.
          curl -sSfL --retry 3 -A "$USER_AGENT" "$EXPORT_URL" \
            | gzip -dc \
            | node --max-old-space-size=5632 --import tsx pipeline/build-index.ts \
                --out public/food-index --source-url "$EXPORT_URL" --last-modified "$LAST_MODIFIED" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit the index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/food-index
          if git diff --cached --quiet; then echo "The index did not change"; exit 0; fi
          git commit -q -m "Update the food index from the Open Food Facts export"
          git pull -q --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
